<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Orchi board</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#6e7781;--line:#e6eaef;--sub:#f6f8fa;--col:#f6f8fa;--red:#cf222e;--orange:#bc4c00;--blue:#0969da;--green:#1a7f37;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--line:#262c36;--sub:#151b23;--col:#11161d;--red:#f85149;--orange:#db6d28;--blue:#4493f8;--green:#3fb950}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.muted{color:var(--muted)}.c-red{--c:var(--red)}.c-orange{--c:var(--orange)}.c-blue{--c:var(--blue)}.c-green{--c:var(--green)}.c-grey{--c:var(--muted)}
.dot{display:inline-block;align-self:center;width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
a{color:var(--blue);text-decoration:none;cursor:pointer}
button{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}button.primary{background:var(--green);border-color:var(--green);color:#fff}button.warn{color:var(--orange)}
button:disabled{opacity:.5;cursor:default}button.small{font-size:12px;padding:1px 10px}
header{padding:14px 20px 0;border-bottom:1px solid var(--line)}.top{display:flex;align-items:baseline;gap:12px}.top h1{font-size:15px;margin:0;flex:1;font-weight:600}
.tabs{display:flex;gap:18px;margin-top:10px}.tabs a{padding:6px 0;border-bottom:2px solid transparent;color:var(--muted)}.tabs a.on{border-color:var(--fg);color:var(--fg)}
main{padding:8px 20px 70px}main.crews{max-width:860px}
.error{margin:10px 20px 0;padding:8px 12px;border-radius:8px;font-size:13px;color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.sum{font-size:20px;line-height:28px;margin:18px 0 22px}.sum b{font-weight:600}.sum .o{color:var(--orange);font-weight:600}.sum .r{color:var(--red);font-weight:600}
main.board .sum{font-size:18px;line-height:26px;margin:8px 0 16px}
.empty{font-size:13px;color:var(--muted);padding:30px 0}
/* crews */
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;margin:0 -8px;border-radius:6px;cursor:pointer}.row:hover{background:var(--sub)}
.row .who{width:190px;flex:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .what{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .age{color:var(--muted);font-size:12px;width:60px;text-align:right;flex:none}.row .st{font-size:12px;color:var(--c);width:90px;flex:none}
.row+.row{border-top:1px solid var(--line);border-radius:0}
.foot{margin-top:26px;font-size:13px;color:var(--muted)}
.badge{font-size:12px;border-radius:10px;padding:0 8px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none;white-space:nowrap}
.back{color:var(--blue);cursor:pointer;font-size:13px;display:inline-block;margin:14px 0 6px}
.crh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.crh h2{font-size:20px;margin:0;font-weight:600}
.meta{font-size:13px;color:var(--muted)}.meta b{color:var(--fg);font-weight:500}
.sec{font-size:13px;font-weight:600;color:var(--muted);margin:26px 0 8px;display:flex;gap:8px}
.qc{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}.qc.blk{border-left:3px solid var(--orange)}
.qc h3,.dw h3{font-size:16px;line-height:22px;margin:4px 0 8px;font-weight:600}.tag{font-size:12px;color:var(--muted)}.tag.b{color:var(--orange);font-weight:600}
.ctx{font-size:13px;background:var(--sub);border-radius:8px;padding:10px 12px;margin:8px 0 12px}.ctx ul{margin:4px 0 0;padding-left:18px}.ctx a{margin-right:12px}
.plan{margin:6px 0 0;padding-left:18px;font-size:13px}.plan li{margin:3px 0}
.opt{display:flex;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer}.opt:hover{border-color:var(--muted)}.opt.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.opt .r{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted);margin-top:3px;flex:none}.opt.on .r{border:4px solid var(--blue)}.opt .d{font-size:13px;color:var(--muted)}
.rec{font-size:11px;color:var(--green);border:1px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:9px;padding:0 6px;margin-left:6px}
textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--fg);resize:vertical;min-height:38px;margin-top:4px}
.send{display:flex;gap:8px;align-items:center;margin-top:10px}.send .muted{font-size:12px;flex:1}
.hist div{font-size:13px;padding:3px 0;display:flex;gap:10px}.hist .tm{color:var(--muted);width:44px;flex:none}.hist .b{color:var(--orange)}.ok{color:var(--green)}
.syn{margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}.syn .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}.syn .hd b{font-size:15px;flex:1}.syn .hd span{font-size:12px;color:var(--muted)}
.syn p{margin:0 0 10px;line-height:22px;max-width:72ch}.syn .ref{color:var(--blue);cursor:pointer;white-space:nowrap}
/* board */
.crumbs{font-size:13px;margin:16px 0 0;color:var(--muted)}.crumbs b{color:var(--fg);font-weight:600}
.kb{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:8px;overflow-x:auto}
.cp{background:var(--col);border-radius:10px;padding:8px;min-height:360px;border:1px solid var(--line)}
.cp.you{border-top:3px solid var(--orange)}.cp.drop{box-shadow:inset 0 0 0 2px var(--blue)}
.ch{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:2px 4px 10px;display:flex;gap:6px}.cp.you .ch{color:var(--orange)}.ch .n{font-weight:400}
.k{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:13px;line-height:18px;box-shadow:0 1px 0 #0000000a}.k:hover{border-color:var(--muted)}
.k .b{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--c)}.k .b .id{color:var(--muted)}.k .b .ic{margin-left:auto;color:var(--orange)}
.k .b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k.big .t{font-weight:600}.k .sub{font-size:12px;color:var(--muted);margin-top:2px}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);margin-top:8px}.bar i{display:block;background:var(--green)}
.yo{font-size:12px;color:var(--orange);margin-top:6px}
.k.flash{animation:fl 1.6s ease-out}@keyframes fl{from{box-shadow:0 0 0 3px var(--blue)}to{box-shadow:0 0 0 0 transparent}}
.dw{max-width:780px}.dh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:12px}.dh h2{font-size:20px;margin:0;font-weight:600}
.path{display:flex;margin:14px 0 4px;font-size:12px;flex-wrap:wrap}.path span{padding:3px 10px;border:1px solid var(--line);color:var(--muted);margin-right:-1px}.path span:first-child{border-radius:12px 0 0 12px}.path span:last-child{border-radius:0 12px 12px 0}.path span.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
ul.l,ol.l{margin:0;padding-left:18px}ul.l li,ol.l li{margin:3px 0}
.chk{display:flex;gap:8px;font-size:13px;padding:3px 0;color:var(--c)}.chk .mark{width:16px;flex:none;text-align:center}
.box{background:var(--sub);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:16px}.box .dot{margin-right:6px}
.acts{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details summary{cursor:pointer}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 20px;display:none;gap:8px;align-items:center}#bar.on{display:flex}#bar span{flex:1}
</style>
</head>
<body>
<header>
  <div class="top"><h1 id="repo">Orchi board</h1><span id="updated" class="muted" style="font-size:12px"></span><span id="readonly" class="muted" style="font-size:12px" hidden>Read-only · actions happen on the owner's board</span><button id="refresh" class="small">Refresh</button></div>
  <nav class="tabs"><a id="tab-crews" href="#crews">Crews</a><a id="tab-board" href="#board">Board</a></nav>
</header>
<div id="error" class="error" hidden></div>
<main id="main"><div class="empty">Reading GitHub…</div></main>
<div id="bar"></div>
<script>
"use strict";
// The board is a view: GitHub state and, on the owner's board, what Orchi reported. There a button or a drop becomes
// a request to Orchi, sent after a 5 s window in which the user can undo it; everywhere else the board is read-only.
const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const plural = (n, word, many = word + "s") => `${n} ${n === 1 ? word : many}`;
const ORDER = ["ask", "review", "progress", "plan", "backlog", "done"];
const DEFAULT_COLUMNS = [["plan", "Needs planning"], ["backlog", "Backlog"], ["progress", "In progress"], ["ask", "Questions for you", true], ["review", "Your review", true], ["done", "Done"]].map(([key, title, you]) => ({ key, title, you: !!you }));
const STATE = { coord: ["grey", "coordinating"], waiting: ["orange", "waits for you"], stuck: ["red", "stuck"], working: ["blue", "working"], background: ["grey", "background"], idle: ["grey", "idle"], free: ["grey", "free"] };
const CREW_ORDER = Object.keys(STATE);
const DROPS = { "plan>backlog": ["plan", "Asked Orchi to plan #"], "backlog>progress": ["take", "Asked Orchi to start #"], "progress>backlog": ["defer", "Asked Orchi to defer #"] };
const UNDO_MS = 5000, MOVE_MS = 3 * 60 * 1000;

let data = null, snap = null, stale = false, flash = null;
const picks = {}, notes = {}, hidden = new Map(), moved = new Map(), local = [];
let pending = null;

// ── time ──
const when = (iso) => { const t = Date.parse(iso || ""); return Number.isNaN(t) ? null : t; };
function ago(iso) {
  const t = when(iso); if (t === null) return "";
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 60) return `${m} min`;
  if (m < 1440) return `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ""}`;
  return plural(Math.floor(m / 1440), "day");
}
const hm = (iso) => { const t = when(iso); return t === null ? "" : new Date(t).toTimeString().slice(0, 5); };

// ── routes: #crews, #crews/<name>, #board, #board/<group>/<epic|->/<task> ──
function route() {
  const parts = location.hash.replace(/^#/, "").split("/").map((part) => decodeURIComponent(part));
  if (parts[0] === "board") return { tab: "board", group: parts[1] || null, epic: parts[2] && parts[2] !== "-" ? +parts[2] : null, task: parts[3] ? +parts[3] : null };
  return { tab: "crews", crew: parts[0] === "crews" && parts[1] ? parts[1] : null };
}
const link = (...parts) => "#" + parts.map((part) => encodeURIComponent(String(part))).join("/");

// ── data ──
const columns = () => snap?.board?.columns?.length ? snap.board.columns : DEFAULT_COLUMNS;
const columnTitle = (key) => (columns().find((column) => column.key === key) || {}).title || key;
const owner = () => snap?.owner === true;
const crews = () => snap?.crews || [];
const questions = () => (snap?.questions || []).filter((question) => !hidden.has(question.id));
const questionsOf = (name) => questions().filter((question) => question.crew === name);
const questionById = (id) => (snap?.questions || []).find((question) => question.id === id);
const pullOf = (number) => (snap?.pulls || []).find((pull) => pull.number === number);
function stageOf(card) {
  const move = moved.get(card.number);
  return move ? move.to : card.stage;
}
function tasks(filter) { return (snap?.board?.tasks || []).filter(filter).map((card) => ({ ...card, stage: stageOf(card), requested: moved.has(card.number) })); }
const count = (cards, stage) => cards.filter((card) => card.stage === stage).length;
const aggregate = (cards) => cards.length ? ORDER.find((stage) => count(cards, stage)) : "plan";
function titleOf(number) {
  const board = snap?.board || {};
  const found = [...(board.groups || []), ...(board.epics || []), ...(board.tasks || [])].find((item) => item.number === number);
  return found ? found.title : "";
}
const ref = (number) => number ? `#${number}${titleOf(number) ? " " + titleOf(number) : ""}` : "";

// ── requests ──
function bar(html, undoable) {
  const element = $("bar");
  element.innerHTML = `<span>${html}</span>` + (undoable ? `<button data-undo>Undo</button>` : "");
  element.classList.add("on");
  clearTimeout(bar.timer);
  bar.timer = setTimeout(() => element.classList.remove("on"), undoable ? UNDO_MS : 3000);
}
async function post(path, body) {
  const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const reply = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(reply.error || response.statusText);
  return reply;
}
// Show the result at once, send it after UNDO_MS, and undo the local change if the user asks or the send fails.
function request(body, message, apply, revert) {
  if (pending) flush();
  apply && apply();
  const item = { body, revert, timer: setTimeout(() => flush(item), UNDO_MS) };
  pending = item;
  bar(esc(message), true);
  draw();
}
async function flush(item = pending) {
  if (!item || pending !== item) return;
  clearTimeout(item.timer);
  pending = null;
  try { await post("request", item.body); }
  catch (error) { item.revert && item.revert(); bar("Not sent: " + esc(error.message)); draw(); }
}
function undo() {
  if (!pending) return;
  clearTimeout(pending.timer);
  pending.revert && pending.revert();
  pending = null;
  $("bar").classList.remove("on");
  draw();
}
function move(card, to, action, message) {
  request({ action, issue: card.number }, message,
    () => { moved.set(card.number, { to, from: card.stage, at: Date.now() }); flash = card.number; },
    () => moved.delete(card.number));
}

// ── Crews tab ──
function orchiRow() {
  const working = crews().filter((crew) => crew.state !== "free").length;
  return { name: "Orchi", role: "coordinator", state: "coord", doing: `Coordinating ${plural(working, "crew")}`, orchi: true };
}
function badge(name) {
  const list = questionsOf(name);
  if (!list.length) return "";
  return `<span class="badge c-${list.some((question) => question.blocking) ? "orange" : "grey"}">${plural(list.length, "question")}</span>`;
}
function doing(crew) {
  return crew.doing || crew.question || (crew.background && "Background: " + crew.background) || crew.stuck || ref(crew.issue) || "";
}
function pathOf(number) {
  const board = snap?.board || {};
  const task = (board.tasks || []).find((card) => card.number === number) || (board.tasks || []).find((card) => card.pull?.number === number);
  if (task) return link("board", task.group, groupOf(task.group)?.kind === "Initiative" && task.epic ? task.epic : "-", task.number);
  const epic = (board.epics || []).find((item) => item.number === number);
  if (epic) return link("board", epic.group, number);
  const group = (board.groups || []).find((item) => item.number === number);
  return group ? link("board", group.key) : "";
}
function prose(text) {
  // Crews by full name or by the short name after their role, e.g. "saved-carts" for "[dev-lead] saved-carts".
  const names = new Map();
  for (const crew of [orchiRow(), ...crews()].filter((item) => item.name)) {
    names.set(esc(crew.name), crew.name);
    const short = crew.name.replace(/^\[[^\]]*\]\s*/, "");
    if (short !== crew.name && !names.has(esc(short))) names.set(esc(short), crew.name);
  }
  const words = [...names.keys()].sort((a, b) => b.length - a.length).map((name) => name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return esc(text).replace(new RegExp(`(?<![\\w-])(?:${words.join("|")})(?![\\w-])|#\\d+\\b`, "g"), (match) => {
    const go = names.has(match) ? link("crews", names.get(match)) : pathOf(+match.slice(1));
    return go ? `<span class="ref" data-go="${esc(go)}">${match}</span>` : match;
  });
}
function summaryBlock() {
  const summary = snap?.summary || {};
  const paragraphs = (summary.paragraphs || []).filter((item) => item && (item.lead || item.text));
  const by = ["by Orchi", summary.at && hm(summary.at)].filter(Boolean).join(" · ");
  const head = `<div class="hd"><b>Summary</b><span>${by}</span><button class="small" data-summary>Refresh</button></div>`;
  if (!paragraphs.length) return `<div class="syn">${head}<div class="muted" style="font-size:13px">No summary yet: Refresh asks Orchi for one.</div></div>`;
  return `<div class="syn">${head}` + paragraphs.map((item) => `<p>${item.lead ? `<b>${prose(item.lead)}</b> ` : ""}${prose(item.text || "")}</p>`).join("") +
    (summary.since ? `<p class="muted" style="font-size:13px">${prose(summary.since)}</p>` : "") + `</div>`;
}
function crewList() {
  if (!owner()) {
    const ready = (snap?.queue || []).map((item) => `#${item.issue} ${esc(item.title || titleOf(item.issue))}`);
    return `<div class="sum">Crews and the Summary are on the owner's board.</div><div class="foot">This board shows the work as ` +
      `GitHub has it, on the Board tab.${ready.length ? ` Ready to start: ${ready.join(", ")}.` : ""}</div>`;
  }
  const list = [orchiRow(), ...crews()].sort((a, b) => CREW_ORDER.indexOf(a.state) - CREW_ORDER.indexOf(b.state));
  const asking = list.filter((crew) => questionsOf(crew.name).length).length;
  const stuck = crews().filter((crew) => crew.state === "stuck").length;
  const open = questions().length;
  let html = `<div class="sum">${crews().length ? plural(crews().length, "crew") + " at work." : "No crews in the pool."}` +
    (asking ? ` <b class="o">${asking} wait${asking === 1 ? "s" : ""} for your answers</b> <span class="muted" style="font-size:15px">(${plural(open, "question")})</span>` : " Nothing waits for your answers") +
    (stuck ? `, <b class="r">${stuck} stuck</b>` : "") + ".</div>";
  html += list.map((crew) => {
    const [tone, label] = STATE[crew.state] || STATE.idle;
    return `<div class="row c-${tone}" data-go="${esc(link("crews", crew.name))}"><span class="dot"></span><span class="who">${esc(crew.name)}</span>` +
      `<span class="what muted">${esc(doing(crew))}</span>${badge(crew.name)}<span class="st">${label}</span><span class="age">${esc(ago(crew.since))}</span></div>`;
  }).join("");
  const queue = (snap?.queue || []).map((item) => `#${item.issue} ${esc(item.title || titleOf(item.issue))}${item.action === "plan" ? " (plan)" : ""}`);
  const busy = crews().filter((crew) => crew.state !== "free").length;
  const foot = [];
  if (queue.length) foot.push(`Queued: ${queue.join(", ")}, starts when a crew is free.`);
  if (snap?.limit) foot.push(`Pool ${busy} of ${snap.limit}.`);
  if (snap?.mode) foot.push(`Autonomous mode ${snap.mode} · <a data-mode="${snap.mode === "on" ? "off" : "on"}">Turn ${snap.mode === "on" ? "off" : "on"}</a>`);
  if (foot.length) html += `<div class="foot">${foot.join(" ")}</div>`;
  return html + summaryBlock();
}
function crewPage(name) {
  const crew = name === "Orchi" ? orchiRow() : crews().find((item) => item.name === name);
  if (!crew) return `<span class="back" data-go="#crews">← Crews</span><div class="empty">${esc(name)} is no longer in the pool.</div>`;
  const [tone, label] = STATE[crew.state] || STATE.idle;
  const path = [...(crew.path || []).map(ref), ref(crew.issue)].filter(Boolean).join(" › ");
  const pull = crew.pr && pullOf(crew.pr);
  const meta = [path, crew.pr ? `PR #${crew.pr}${pull ? " · checks " + pull.checks : ""}` : "", crew.branch, crew.runs].filter(Boolean).map(esc);
  if (!crew.orchi && owner()) meta.push(`<a data-open="${esc(crew.name)}">Open session ↗</a>`);
  let html = `<span class="back" data-go="#crews">← Crews</span><div class="crh"><h2>${esc(crew.name)}</h2><span class="meta">${esc(crew.role || "")}</span>` +
    `<span class="c-${tone}" style="color:var(--c);font-size:13px">● ${label}${crew.since ? " · " + esc(ago(crew.since)) : ""}</span></div>` +
    `<div class="meta" style="margin-top:4px">${esc(doing(crew))}</div><div class="meta" style="margin-top:2px">${meta.join(" · ")}</div>`;
  if (!owner()) return html;
  const list = questionsOf(crew.name);
  html += list.length ? `<div class="sec">Open questions · ${list.length}</div>` + list.map((question) => `<div class="qc ${question.blocking ? "blk" : ""}">${questionCard(question)}</div>`).join("")
    : `<div class="sec">Questions</div><div class="muted">No open questions.</div>`;
  return html + answered(crew.name);
}
function answered(name) {
  const known = new Set((snap?.answered || []).map((entry) => entry.id));
  const list = [...local.filter((entry) => !known.has(entry.id)), ...(snap?.answered || [])].filter((entry) => entry.crew === name);
  return `<div class="sec">Answered today · ${list.length}</div><div class="hist">` + (list.map((entry) =>

// ── one question: context, options, note, send ──
function choicesOf(question) {

    { label: "Request changes", detail: "Write what to change below.", recommended: false }];
}
function context(question) {

  const plan = question.plan?.length ? `<ol class="plan">${question.plan.map((step) => `<li>${esc(step)}</li>`).join("")}</ol>` : "";
  const links = question.links?.length ? `<div style="margin-top:6px">${question.links.map((item) => /^https?:/.test(item.url) ? `<a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.label)} ↗</a>` : `<span class="muted">${esc(item.label)}</span>`).join(" ")}</div>` : "";

    `<h3>${esc(question.text)}</h3>` + context(question);

  }
  const choices = choicesOf(question);
  const key = esc(question.id);
  const pick = choices.length ? picks[question.id] : -1;
  const by = question.crew === "Orchi" ? "Orchi" : question.crew;
  let html = head + choices.map((choice, index) => `<div class="opt ${pick === index ? "on" : ""}" data-pick="${key}" data-index="${index}"><span class="r"></span><div><div>${esc(choice.label)}${choice.recommended ? `<span class="rec">recommended by ${esc(by)}</span>` : ""}</div>${choice.detail ? `<div class="d">${esc(choice.detail)}</div>` : ""}</div></div>`).join("");
  if (choices.length) html += `<div class="opt ${pick === -1 ? "on" : ""}" data-pick="${key}" data-index="-1"><span class="r"></span><div><div>Something else</div><div class="d">Write it below.</div></div></div>`;
  const placeholder = pick === -1 ? "Your answer" : "Note for the crew (optional)";
  html += `<textarea data-note="${key}" rows="1" placeholder="${placeholder}">${esc(notes[question.id] || "")}</textarea>`;
  if (question.kind === "design") html += `<div class="meta" style="margin-top:8px"><a data-design="${esc(question.crew)}">Rate on the design board ↗</a></div>`;
  const to = question.crew === "Orchi" ? "Goes to Orchi." : `Goes to ${esc(question.crew)} through Orchi.`;
  return html + `<div class="send"><span class="muted">${pick === undefined ? "Pick an option." : to}</span><button class="primary" data-send="${key}" ${pick === undefined ? "disabled" : ""}>Send answer</button></div>`;
}
function sendAnswer(id) {
  const question = questionById(id);
  if (!question) return;
  const choices = choicesOf(question);
  const pick = choices.length ? picks[id] : -1;
  const note = (notes[id] || "").trim();
  if (pick === undefined) return;
  const choice = pick >= 0 ? choices[pick].label : "";
  if (!choice && !note) { document.querySelector(`[data-note="${CSS.escape(id)}"]`)?.focus(); return; }
  let body;
  if (question.kind === "plan" && !question.choices.length) {
    if (pick === 0) body = { action: "approve_plan", crew: question.crew, id };
    else if (!note) { document.querySelector(`[data-note="${CSS.escape(id)}"]`)?.focus(); return; }
    else body = { action: "change_plan", crew: question.crew, id, text: note };
  } else {
    body = { action: "answer_question", crew: question.crew, id, question: question.text, choice, text: choice ? "" : note,

  const answer = choice || note;
  const entry = { id, crew: question.crew, text: question.text, answer, at: new Date().toISOString(), picked: false };
  request(body, `Sent “${answer}” to ${question.crew}.`,
    () => { hidden.set(id, Date.now()); local.unshift(entry); },
    () => { hidden.delete(id); local.splice(local.indexOf(entry), 1); });
}

// ── Board tab ──
function scoped(cards) {

  const yours = [review && `<span class="o">${review} wait${review === 1 ? "s" : ""} for your review</span>`, ask && `<span class="o">${plural(ask, "question")} for you</span>`].filter(Boolean);

    `${count(cards, "plan")} need${count(cards, "plan") === 1 ? "s" : ""} planning, ${count(cards, "done")} of ${cards.length} done.</div>`;

function kanban(items, render, droppable) {

function taskCard(card) {

    `<div class="t">${esc(card.title)}</div><div class="b"><span class="id">#${card.number}</span><b class="dot"></b><span>${esc(state)}</span>${card.back ? '<span class="ic" title="Back from your review">↩</span>' : ""}</div></div>`;
}
function groupOf(key) { return (snap?.board?.groups || []).find((group) => group.key === key); }
function crumbs(view, group, epic, card) {

  if (group) parts.push(epic || card ? `<a href="${esc(link("board", group.key))}">${esc(group.title)}</a>` : `<b>${esc(group.title)}</b>`);
  if (epic && group?.kind === "Initiative") parts.push(card ? `<a href="${esc(link("board", group.key, epic.number))}">${esc(epic.title)}</a>` : `<b>${esc(epic.title)}</b>`);

function checks(pull) {

    `<div class="meta">${card.kind} · ${crew}</div><div class="path">${columns().map((column) => `<span class="${column.key === card.stage ? "on" : ""}">${esc(column.title)}</span>`).join("")}</div>`;

// ── drawing ──
function draw() {
  if (document.activeElement?.tagName === "TEXTAREA" && document.activeElement.id !== "feedback" && !pending) { stale = true; return; }
  stale = false;
  const view = route();
  $("tab-crews").classList.toggle("on", view.tab === "crews");
  $("tab-board").classList.toggle("on", view.tab === "board");
  const main = $("main");

  else main.innerHTML = view.tab === "board" ? boardPage(view) : view.crew ? crewPage(view.crew) : crewList();

  for (const [number, entry] of moved) {
    const card = (snap?.board?.tasks || []).find((item) => item.number === number);
    if (!card || card.stage !== entry.from || now - entry.at > MOVE_MS) moved.delete(number);
  }
  const known = new Set((snap?.answered || []).map((entry) => entry.id));
  for (let i = local.length - 1; i >= 0; i--) if (known.has(local[i].id)) local.splice(i, 1);
}

    snap = data.snapshot && !data.snapshot.error ? data.snapshot : snap;
    if (data.snapshot?.error) data.error = data.error || data.snapshot.error;

  } catch (error) {

  if (!column || !dragged) return;
  event.preventDefault();
  column.classList.remove("drop");
  const card = tasks((item) => item.number === dragged)[0];
  dragged = null;
  if (!card || card.stage === column.dataset.col) return;
  const rule = DROPS[`${card.stage}>${column.dataset.col}`];
  if (rule) move(card, column.dataset.col, rule[0], rule[1] + card.number + ".");
  else bar("Orchi moves this card when the work gets there.");
});
window.addEventListener("hashchange", () => { draw(); window.scrollTo(0, 0); });
$("refresh").onclick = async () => { $("updated").textContent = "refreshing…"; await post("refresh").catch(() => {}); };
if (typeof EventSource === "function") new EventSource("events").onmessage = load;
setInterval(() => snap && !pending && draw(), 60000);
load();
</script>
</body>
